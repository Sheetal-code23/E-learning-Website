<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <div class="container">
            <img src="logo1.jpg" alt="e-learn logo" class="logo">
            <nav>
                <ul>
                    <a href="landing_page.html" class="home">Home</a>
                    <a href="free_learning.html" class="free-learning">Free Learning</a>
                    <a href="blog.html" class="blog">Blog</a>
                    <a href="job.html" class="jobs">Jobs</a>
                    <a href="contact.html" class="contact">Contact Us</a>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="intro">
            <h2>Get in Touch</h2>
            <p>If you have any questions, comments, or feedback, feel free to reach out to us using the form below.</p>
        </section>
        <section class="contact-form">
            <h3>Contact Form</h3>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 e-learn. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
